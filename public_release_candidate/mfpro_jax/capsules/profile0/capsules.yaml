    produces: [{port: schema_detail, type: sqlite_schema_detail}]
    applicable_to: [unencrypted_sqlite_database]
    not_applicable_to: [non_sqlite_file, encrypted_database, unknown_schema_object]
    failure_modes: {reason_codes: [encrypted_database, unsupported_format, unreadable_file, generic_failure], output_conditions: [empty]}

  - <<: *profile0_defaults
    capsule_id: p0.sqlite.query
    tool_name: sqlite_query
    name: Query SQLite database
    capability_layer: generic_parser

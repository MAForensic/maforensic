    executor_ref: existing_tool_registry:sqlite_query
    consumes:
      - {port: database, type: host_file, required: true}
      - {port: query, type: sqlite_query, required: true}
      - {port: schema, type: sqlite_schema, required: false}
    produces: [{port: rows, type: sqlite_row}]
    applicable_to: [unencrypted_sqlite_database]
    not_applicable_to: [non_sqlite_file, encrypted_database, mutating_sql]
    failure_modes: {reason_codes: [encrypted_database, unsupported_format, unreadable_file, generic_failure], output_conditions: [empty]}


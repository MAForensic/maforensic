[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mfpro-jax"
version = "0.1.0"
description = "evidence agent source candidate"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.28.1",
    "openai>=2.36.0",
    "pillow>=12.2.0",
    "pyyaml>=6.0",
]

[project.scripts]
mfpro-profile0 = "mfpro_jax.main:main"

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["mfpro_jax*"]

[tool.setuptools.package-data]
"mfpro_jax" = ["tool_output_schemas/*.json"]
"mfpro_jax.capsules" = ["schemas/*.json", "profile0/*.yaml"]
